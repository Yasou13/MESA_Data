[project]
name = "mesa-legal-data"
version = "0.1.0"
description = "MESA Legal Data Platform for collecting, canonicalizing, and releasing Turkey legal data."
readme = "README.md"
authors = [
    { name = "Yasin Büyüktepe", email = "yasinbuyuktepe3@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.28.1",
    "jsonschema>=4.23.0",
    "lxml>=5.3.0",
    "pydantic-settings>=2.7.1",
    "pydantic>=2.10.6",
    "pypdf>=5.2.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.2",
    "structlog>=25.1.0",
    "tenacity>=9.0.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "puremagic>=1.23",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
mesa-data = "mesa_legal_data.cli:app"
mesa-legal-data = "mesa_legal_data:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["BLE001", "B008", "DTZ007", "E501", "W293", "W291"]
